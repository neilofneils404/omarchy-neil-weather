name: Weather tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Python 3.9 has no setup-python build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest version the README promises, plus a modern interpreter.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -c "import json; json.load(open('manifest.json'))"
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/model.test.js
